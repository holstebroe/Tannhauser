name: Build Tannhauser CLAP Plugin

on:
  push:
    branches: [ "**" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    # DSP conformance (docs/spec/07_VALIDATION.md) and the offscreen GUI test.
    - name: Tests
      if: runner.os == 'Linux'
      run: |
        build/tannhauser_dsp_test
        build/tannhauser_gui_test build/gui_snapshot.ppm
        build/tearwash_core_test
        build/tearwash_gui_test build/tearwash_snapshot.ppm

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tannhauser-${{ runner.os }}
        path: |
          build/tannhauser.clap
          build/Release/tannhauser.clap
          build/gui_snapshot.ppm
          build/tearwash225.clap
          build/Release/tearwash225.clap
          build/tearwash_snapshot.ppm
        if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: release-raw
    - name: Package
      run: |
        mkdir dist
        for os in Linux Windows macOS; do
          (cd release-raw/tannhauser-$os && zip -r ../../dist/Tannhauser-$os-${{ github.ref_name }}.zip .)
        done
    - uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true
